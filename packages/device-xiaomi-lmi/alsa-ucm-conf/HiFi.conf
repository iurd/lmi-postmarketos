# Author: Shandorman <98683030+jiganomegsdfdf@users.noreply.github.com>

SectionVerb {
        EnableSequence [
                cdev "hw:0"
                cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
                cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
        ]

        DisableSequence [
                cdev "hw:0"
                cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
                cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
        ]

        Value {
                TQ "HiFi"
        }
}

SectionDevice."Speaker" {
        Comment "Speaker playback"

        EnableSequence [
                cdev "hw:0"
        ]

        DisableSequence [
                cdev "hw:0"
        ]

        Value {
                PlaybackPriority 150
                PlaybackPCM "hw:0,0"
                PlaybackChannels 1
        }
}

SectionDevice."Mic1" {
        Comment "Main microphone"

        EnableSequence [
                cdev "hw:0"
                cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
                cset "name='TX DEC0 MUX' SWR_MIC"
                # Mainline TX SMIC ADC0 maps to TX SWR_ADC0, which the DTS
                # routes to the codec's ADC1 output (AMIC1). Use the enum
                # index (0=ZERO, 1=ADC0) because the name is not applied.
                cset "name='TX SMIC MUX0' 1"
                cset "name='TX_AIF1_CAP Mixer DEC0' 1"
                cset "name='ADC1_MIXER Switch' 1"
                cset "name='ADC1 Volume' 12"
                cset "name='ADC1 Switch' 1"
        ]

        DisableSequence [
                cdev "hw:0"
                cset "name='ADC1_MIXER Switch' 0"
                cset "name='ADC1 Switch' 0"
                cset "name='TX SMIC MUX0' ZERO"
                cset "name='TX_AIF1_CAP Mixer DEC0' 0"
                cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
        ]

        Value {
                CapturePriority 200
                CapturePCM "hw:0,2"
                CaptureMixerElem "ADC1"
                CaptureMixer "hw:0"
                CaptureChannels 2
        }
}
